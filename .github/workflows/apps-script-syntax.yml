name: Apps Script checks

on:
  pull_request:
  push:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check individual .gs syntax
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            cp "$file" /tmp/apps-script-check.js
            if ! node --check /tmp/apps-script-check.js; then
              echo "::error file=$file::JavaScript syntax error"
              status=1
            fi
          done < <(find . -type f -name '*.gs' -print0)
          exit "$status"

      - name: Check combined Apps Script global scope
        shell: bash
        run: |
          find . -type f -name '*.gs' -print0 | sort -z | xargs -0 cat > /tmp/apps-script-bundle.js
          node --check /tmp/apps-script-bundle.js

      - name: Check cross-file project globals
        run: node .github/check-project-globals.js
